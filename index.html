<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Depósito Vivo</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#171b25;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}[hidden]{display:none!important}.screen{height:100dvh;max-width:640px;margin:auto;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);display:flex;flex-direction:column;gap:8px;overflow:hidden}.bar{height:45px;flex:none;display:flex;align-items:center;justify-content:space-between;font-variant-numeric:tabular-nums}.name{font-size:12px;letter-spacing:.13em;font-weight:900;color:#424957}.numbers{display:flex;align-items:center;gap:12px}.credits{font-weight:800;font-size:18px}.clock{font-size:26px;font-weight:800}.iconbtn{border:1px solid #d6d9e0;background:#fff;color:#171b25;border-radius:8px;width:33px;height:33px}.events{display:grid;gap:6px;flex:none}.eventline{width:100%;display:grid;grid-template-columns:71px 47px minmax(0,1fr) 16px;align-items:center;gap:5px;border:1px solid #d9dce3;border-radius:8px;background:#fff;color:inherit;padding:8px;text-align:left;min-height:44px}.eventline.active{border:2px solid #171b25}.label{font-size:11px;letter-spacing:.05em;font-weight:900}.when{font-size:13px;font-variant-numeric:tabular-nums}.chips{display:flex;gap:3px;min-width:0;overflow:hidden}.chip{width:16px;height:16px;flex:none;background:var(--sku);border-radius:1px}.chevron{color:#667085}.boardwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.board{width:min(100%,calc((100dvh - 270px)*1.333));aspect-ratio:8/6;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(6,1fr);gap:4px;touch-action:none}.board.expanded{aspect-ratio:8/7;grid-template-rows:repeat(7,1fr)}.cell{border:1px solid #e1e3e8;background:#f2f3f5;border-radius:2px;padding:0;min-width:0;min-height:0}.cell.stock{background:var(--sku);border-color:#0001}.cell.selected{outline:2px solid #171b25;outline-offset:1px}.cell.pickable{box-shadow:0 0 0 2px #171b25}.cell.target{border-color:#171b25}.cell.dragging{opacity:.35}.qarea{flex:none}.qlabel{font-size:11px;font-weight:900;letter-spacing:.08em;color:#555e6b;margin-bottom:5px}.qrow{display:flex;gap:4px;min-height:30px;touch-action:none}.qcell{width:min(11vw,38px);height:min(11vw,38px);border:1px dashed #8c95a2;background:#f5f6f8;border-radius:2px;padding:0}.qcell.full{background:var(--sku);border:1px solid #0001}.qcell.locked{box-shadow:inset 0 0 0 3px #fff9}.qcell.dragging{opacity:.35}.status{flex:none;text-align:center;min-height:34px;color:#4c5663;font-size:12px;line-height:1.3;overflow:hidden;margin-bottom:3px}.scrim{position:fixed;inset:0;background:#1012178c;z-index:4;display:grid;place-items:end center}.sheet{width:min(100%,640px);max-height:min(78dvh,700px);background:#fff;border:1px solid #e0e2e7;border-radius:20px 20px 0 0;padding:17px 16px max(18px,env(safe-area-inset-bottom));overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sheet h2{font-size:18px;margin:0}.close{background:none;color:#4b5563;border:0;font-size:24px}.list{display:grid;gap:7px}.row{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:7px;background:#f5f6f8;border:1px solid #e0e3e8;border-radius:8px;padding:9px}.row.selected{border-color:#171b25}.rowtime{font-size:12px;font-variant-numeric:tabular-nums}.row button,.start{border:0;background:#171b25;color:white;font-weight:800;border-radius:7px;padding:8px;font-size:12px}.row button:disabled{background:#e1e4e8;color:#747b86}.intro{align-self:center;margin:auto 16px;border-radius:18px;max-width:400px}.intro p{color:#545c68;line-height:1.45}.intro .start{width:100%;font-size:16px;padding:13px}.speed{display:flex;gap:8px;margin-bottom:12px}.speed button{flex:1;background:#f4f5f7;color:#171b25;border:1px solid #d8dce3;border-radius:8px;padding:8px}.speed button.on{background:#171b25;color:white}.upgrades{display:flex;gap:8px;margin-top:16px}.upgrades button{flex:1;border:1px solid #aab0ba;background:#fff;border-radius:7px;padding:8px;font-size:12px;font-weight:700}.upgrades button:disabled{opacity:.4}.link{background:none;border:0;color:#3f4a59;text-decoration:underline;padding:13px 0 0}@media(max-height:620px){.screen{gap:5px}.bar{height:36px}.clock{font-size:22px}.eventline{min-height:39px;padding:5px}.board{width:min(100%,calc((100dvh - 240px)*1.333))}.qcell{height:25px;width:25px}.status{min-height:26px}}
</style></head><body><main class="screen"><header class="bar"><span class="name">DEPÓSITO VIVO</span><div class="numbers"><span class="credits" id="credits">◈ 100</span><button class="iconbtn" id="pause" aria-label="Pausar">Ⅱ</button><span class="clock" id="clock">09:00</span></div></header><div class="events"><button class="eventline" id="open-orders"><span class="label">PEDIDOS</span><span class="when" id="order-time">09:11</span><span class="chips" id="order-chips"></span><span class="chevron">›</span></button><button class="eventline" id="open-arrivals"><span class="label">ENTRADAS</span><span class="when" id="arrival-time">09:05</span><span class="chips" id="arrival-chips"></span><span class="chevron">›</span></button></div><div class="boardwrap"><div class="board" id="board" aria-label="Depósito"></div></div><div class="qarea"><div class="qlabel">CUARENTENA <span id="qcount">0/6</span> <span id="outside"></span></div><div class="qrow" id="quarantine"></div></div><div class="status" id="status">Tocá Pedidos para elegir una salida.</div></main><div class="scrim" id="drawer" hidden><section class="sheet" role="dialog" aria-modal="true"><div class="sheethead"><h2 id="drawer-title"></h2><button class="close" id="close" aria-label="Cerrar">×</button></div><div id="list" class="list"></div><div class="upgrades"><button id="expand-q">+3 cuarentena · ◈75</button><button id="expand-storage">+8 depósito · ◈60</button></div><button class="link" id="restart">Reiniciar partida</button></section></div><div class="scrim" id="intro"><section class="sheet intro"><h2>Depósito Vivo</h2><p>Arrastrá colores a los huecos. Elegí un pedido y arrastrá sus colores a Pedidos. Las entradas llegan solas a cuarentena: movelas al depósito cuando estén habilitadas.</p><div class="speed"><button data-speed="1400">Lento</button><button class="on" data-speed="850">Normal</button><button data-speed="500">Rápido</button></div><button class="start" id="start">Jugar</button></section></div><div class="scrim" id="end" hidden><section class="sheet intro"><h2>Sin créditos</h2><p id="result"></p><button class="start" id="again">Jugar de nuevo</button></section></div><script src="engine.js"></script><script>
(()=>{'use strict';const C=['#ed333b','#2779f4','#22b86c','#f6ce32','#904af0'];const N=['Rojo','Azul','Verde','Amarillo','Violeta'];const $=id=>document.getElementById(id);let g,timer,speed=850,paused=false,drawer=null,selected=null,drag=null,suppress=false;const time=m=>{let n=540+m;return String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};const date=m=>{let n=540+m,d=Math.floor(n/1440);return (d===0?'Hoy':d===1?'Mañana':'Día '+(d+1))+' '+time(m)};const chips=a=>a.map(x=>`<i class="chip" style="--sku:${C[x]}" title="${N[x]}"></i>`).join('');function setup(){g=new DepositoEngine.Game();paused=false;selected=null;$('pause').textContent='Ⅱ';render()}function tick(){if(paused||!g||g.lost)return;g.advance();render()}function renderDrawer(){if(!drawer)return;let orders=drawer==='orders',items=(orders?g.orders:g.arrivals).filter(x=>orders?x.status==='open':x.status!=='done').slice(0,10);$('drawer-title').textContent=orders?'Pedidos · próximos 10':'Entradas · próximos 10';$('list').innerHTML=items.map(x=>{let ready=orders&&x.prepared.length===x.items.length;let label=orders?(ready?'Despachar':x.id===g.active?x.prepared.length+'/'+x.items.length:'Elegir'):(x.status==='future'?'En camino':g.outside.some(v=>v.arrivalId===x.id)?'Afuera':'Cuarentena');return `<div class="row ${x.id===g.active?'selected':''}"><span class="rowtime">${date(x.at)}</span><span class="chips">${chips(x.items)}</span><button data-${orders?'order':'arrival'}="${x.id}" ${!orders?'disabled':''}>${label}</button></div>`}).join('');$('expand-q').disabled=g.credits<=75;$('expand-storage').disabled=g.credits<=60||g.capacity>=64}function render(){if(!g)return;$('clock').textContent=time(g.minute);$('credits').textContent='◈ '+g.credits;$('status').textContent=g.message;let o=g.orders.find(x=>x.status==='open'),a=g.arrivals.find(x=>x.status!=='done'&&x.status!=='future')||g.arrivals.find(x=>x.status==='future');$('order-time').textContent=o?time(o.at):'—';$('arrival-time').textContent=a?time(a.at):'—';$('order-chips').innerHTML=o?chips(o.items):'';$('arrival-chips').innerHTML=a?chips(a.items):'';$('open-orders').classList.toggle('active',!!g.active);let active=g.orders.find(x=>x.id===g.active&&x.status==='open'),need=active?DepositoEngine.count(active.items):null,have=active?DepositoEngine.count(active.prepared):null;$('board').classList.toggle('expanded',g.capacity>48);$('board').innerHTML=g.storage.map((x,i)=>`<button class="cell ${x!=null?'stock':''} ${selected?.kind==='storage'&&selected.index===i?'selected':''} ${x!=null&&active&&have[x]<need[x]?'pickable':''} ${x==null&&selected?'target':''}" style="${x!=null?'--sku:'+C[x]:''}" data-cell="${i}" aria-label="Posición ${i+1}: ${x==null?'vacía':N[x]}"></button>`).join('');$('qcount').textContent=g.quarantine.filter(Boolean).length+'/'+g.quarantine.length;$('outside').textContent=g.outside.length?'· AFUERA '+g.outside.length:'';$('quarantine').innerHTML=g.quarantine.map((x,i)=>`<button class="qcell ${x?'full':''} ${x&&g.minute<x.since+2?'locked':''} ${selected?.kind==='q'&&selected.index===i?'selected':''}" style="${x?'--sku:'+C[x.sku]:''}" data-q="${i}" aria-label="Cuarentena ${i+1}: ${x?N[x.sku]:'vacía'}"></button>`).join('');renderDrawer();if(g.lost){$('result').textContent='Llegaste a las '+time(g.minute)+' y completaste '+g.completed+' pedidos.';$('end').hidden=false;clearInterval(timer)}}function close(){drawer=null;$('drawer').hidden=true}function open(kind){drawer=kind;$('drawer').hidden=false;renderDrawer()}function action(source,target){if(!g||g.lost)return false;let ok=false;if(target==='order'&&source.kind==='storage'){ok=g.pick(source.index)}else if(target?.kind==='storage'){if(source.kind==='storage')ok=g.moveStorage(source.index,target.index);else ok=g.release(source.index,target.index)}if(!ok){if(source.kind==='q'&&g.quarantine[source.index]&&g.minute<g.quarantine[source.index].since+2)g.message='Cuarentena: espera 2 minutos antes de ubicar.';else g.message='Ese movimiento no está disponible.'}selected=null;render();return ok}
$('open-orders').onclick=()=>open('orders');$('open-arrivals').onclick=()=>open('arrivals');$('close').onclick=close;$('drawer').onclick=e=>{if(e.target.id==='drawer')close()};document.addEventListener('click',e=>{let b=e.target.closest('[data-cell],[data-q],[data-order]');if(!b||!g)return;if(suppress){suppress=false;return}if(b.dataset.order){let id=+b.dataset.order,o=g.orders.find(x=>x.id===id);if(o.prepared.length===o.items.length){g.dispatch(id);close()}else{g.select(id);close()}render();return}let target=b.dataset.cell!==undefined?{kind:'storage',index:+b.dataset.cell}:{kind:'q',index:+b.dataset.q};if(selected&&target.kind==='storage'&&(target.kind!==selected.kind||target.index!==selected.index)&&g.storage[target.index]===null){action(selected,target);return}if(target.kind==='storage'&&g.storage[target.index]!==null&&g.active){let o=g.orders.find(x=>x.id===g.active&&x.status==='open');let sku=g.storage[target.index],need=DepositoEngine.count(o.items),have=DepositoEngine.count(o.prepared);if(have[sku]<need[sku]){action(target,'order');return}}selected=target;g.message=target.kind==='q'?'Arrastrá de cuarentena a un hueco.':'Arrastrá a un hueco o a Pedidos.';render()});document.addEventListener('pointerdown',e=>{let b=e.target.closest('[data-cell],[data-q]');if(!b||!g||g.lost)return;let source=b.dataset.cell!==undefined?{kind:'storage',index:+b.dataset.cell}:{kind:'q',index:+b.dataset.q};if(source.kind==='storage'&&g.storage[source.index]===null||source.kind==='q'&&!g.quarantine[source.index])return;drag={source,x:e.clientX,y:e.clientY,moved:false}});document.addEventListener('pointermove',e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>9){drag.moved=true;let selector=drag.source.kind==='storage'?`[data-cell="${drag.source.index}"]`:`[data-q="${drag.source.index}"]`;document.querySelector(selector)?.classList.add('dragging')}});document.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;if(!d.moved)return;suppress=true;setTimeout(()=>suppress=false,100);let b=document.elementFromPoint(e.clientX,e.clientY);let cell=b?.closest('[data-cell]');if(cell)action(d.source,{kind:'storage',index:+cell.dataset.cell});else if(b?.closest('#open-orders'))action(d.source,'order');else render()});$('expand-q').onclick=()=>{g.expand('q');render()};$('expand-storage').onclick=()=>{g.expand('storage');render()};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('on',x===b))});function start(){close();$('intro').hidden=true;$('end').hidden=true;setup();clearInterval(timer);timer=setInterval(tick,speed)}$('start').onclick=start;$('again').onclick=start;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'};$('restart').onclick=()=>{clearInterval(timer);close();$('intro').hidden=false;setup()};})();
</script></body></html>
